# frappe's realtime authorises a socket by fetching its Origin, which frappe_docker's nginx sends without a port,
# so the fetch hits port 80 and every socket fails "Unauthorized: fetch failed" (apps/frappe/realtime/utils.js).
# Container-only, never published; why not developer_mode plus webserver_port: DECISIONS.md.
server {
	listen 80;
	location / {
		proxy_pass http://127.0.0.1:8080;
		proxy_set_header Host $host;
	}
}
