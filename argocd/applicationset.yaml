# One ApplicationSet, two clusters, plain YAML (no Helm, no Kustomize).
#   ACM Placement ragbot-onprem -> Application ragbot-onprem -> deploy/onprem/
#   ACM Placement ragbot-rosa   -> Application ragbot-rosa   -> deploy/rosa/
# Apply on the ACM hub, after argocd/placements.yaml.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: ragbot
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusterDecisionResource:
        configMapRef: acm-placement
        labelSelector:
          matchLabels:
            cluster.open-cluster-management.io/placement: ragbot-onprem
        requeueAfterSeconds: 180
        values:
          site: onprem
    - clusterDecisionResource:
        configMapRef: acm-placement
        labelSelector:
          matchLabels:
            cluster.open-cluster-management.io/placement: ragbot-rosa
        requeueAfterSeconds: 180
        values:
          site: rosa
  template:
    metadata:
      name: 'ragbot-{{ .values.site }}'
    spec:
      project: default
      source:
        repoURL: https://github.com/mothomas/ragbot-openshift.git
        targetRevision: main
        path: 'deploy/{{ .values.site }}'
      destination:
        name: '{{ .name }}'
        namespace: ragbot
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        # Custom resources are applied before their operators finish; retry
        # instead of failing the first sync.
        retry:
          limit: 10
          backoff: {duration: 30s, factor: 2, maxDuration: 5m}
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
