{{- if eq (include "ragbot.role" .) "onprem" }}
{{- $o := .Values.onprem }}
{{- $frappe := include "ragbot.frappeInternalURL" . }}
# ---------------------------------------------------------------- MCP server
apiVersion: v1
kind: ConfigMap
metadata:
  name: ragbot-mcp
  labels:
    {{- include "ragbot.labels" . | nindent 4 }}
data:
  config.yaml: |
    server:
      port: {{ $o.mcp.port }}
    # base_url comes from FRAPPE_BASE_URL, which config.go always prefers
    erpnext:
      timeout: "30s"
      retry:
        max_attempts: 5
        initial_delay: "500ms"
    # The sidebar forwards the caller's sid; with auth on, every tool call runs
    # as that user, so answers only read what Drive lets them read.
    auth:
      enabled: true
      require_auth: true
      oauth2:
        issuer_url: {{ $frappe | quote }}
        token_info_url: "{{ $frappe }}/api/method/frappe.integrations.oauth2.openid_profile"
        validate_remote: true
    tools:
      knowledge_base: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ragbot-mcp
  labels:
    {{- include "ragbot.labels" . | nindent 4 }}
    app.kubernetes.io/name: mcp
spec:
  replicas: {{ $o.mcp.replicas }}
  selector:
    matchLabels:
      {{- include "ragbot.selector" "mcp" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ragbot.selector" "mcp" | nindent 8 }}
      annotations:
        checksum/config: {{ $o.mcp | toJson | sha256sum | trunc 16 }}
    spec:
      enableServiceLinks: false
      {{- include "ragbot.pullSecrets" . | nindent 6 }}
      containers:
        - name: mcp
          image: {{ include "ragbot.image" .Values.images.mcp }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - {name: FRAPPE_BASE_URL, value: {{ $frappe | quote }}}
          ports:
            - {name: http, containerPort: {{ $o.mcp.port }}}
          volumeMounts:
            - {name: config, mountPath: /app/config.yaml, subPath: config.yaml, readOnly: true}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
          resources:
            {{- toYaml $o.mcp.resources | nindent 12 }}
          {{- include "ragbot.containerSecurity" . | nindent 10 }}
      volumes:
        - name: config
          configMap: {name: ragbot-mcp}
---
apiVersion: v1
kind: Service
metadata:
  name: ragbot-mcp
  labels:
    {{- include "ragbot.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: mcp
  ports:
    - {name: http, port: {{ $o.mcp.port }}, targetPort: http}
---
# ---------------------------------------------------------------- AI agent
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ragbot-agent
  labels:
    {{- include "ragbot.labels" . | nindent 4 }}
    app.kubernetes.io/name: agent
spec:
  replicas: {{ $o.agent.replicas }}
  selector:
    matchLabels:
      {{- include "ragbot.selector" "agent" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ragbot.selector" "agent" | nindent 8 }}
    spec:
      # Service links inject AI_AGENT_*-looking vars for any Service named like
      # the prefix; keep the agent's environment to exactly what is set here.
      enableServiceLinks: false
      {{- include "ragbot.pullSecrets" . | nindent 6 }}
      containers:
        - name: agent
          image: {{ include "ragbot.image" .Values.images.agent }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - {name: AI_AGENT_MCP_SERVER_URL, value: "http://ragbot-mcp:{{ $o.mcp.port }}/mcp"}
            - {name: AI_AGENT_FRAPPE_URL, value: {{ $frappe | quote }}}
            - {name: AI_AGENT_CORS_ORIGINS, value: {{ include "ragbot.corsOrigins" . | quote }}}
            # The GPU model on ROSA, reached through the Skupper Listener.
            - {name: AI_AGENT_LLM_PROVIDER, value: ollama}
            - {name: AI_AGENT_LLM_BASE_URL, value: "http://{{ .Values.llm.host }}:{{ .Values.llm.port }}"}
            - {name: AI_AGENT_LLM_MODEL, value: {{ .Values.llm.model | quote }}}
            - {name: AI_AGENT_LLM_NUM_CTX, value: {{ .Values.llm.numCtx | quote }}}
            - {name: AI_AGENT_LLM_REQUEST_TIMEOUT_S, value: {{ $o.agent.requestTimeoutS | quote }}}
            {{- with $o.agent.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - {name: http, containerPort: {{ $o.agent.port }}}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 30
          resources:
            {{- toYaml $o.agent.resources | nindent 12 }}
          {{- include "ragbot.containerSecurity" . | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: ragbot-agent
  labels:
    {{- include "ragbot.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: agent
  ports:
    - {name: http, port: {{ $o.agent.port }}, targetPort: http}
---
# ---------------------------------------------------------------- Embeddings (CPU)
# Ollama with the embedding model baked in (images/ollama-model). Every chunk
# of every document is embedded here, so document text stays on-prem in bulk.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-embed
  labels:
    {{- include "ragbot.labels" . | nindent 4 }}
    app.kubernetes.io/name: ollama-embed
spec:
  replicas: {{ $o.embed.replicas }}
  selector:
    matchLabels:
      {{- include "ragbot.selector" "ollama-embed" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ragbot.selector" "ollama-embed" | nindent 8 }}
    spec:
      enableServiceLinks: false
      {{- include "ragbot.pullSecrets" . | nindent 6 }}
      containers:
        - name: ollama
          {{- include "ragbot.ollamaContainer" (dict "root" . "image" .Values.images.embed "model" .Values.embed.model) | nindent 10 }}
          resources:
            {{- toYaml $o.embed.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-embed
  labels:
    {{- include "ragbot.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: ollama-embed
  ports:
    - {name: http, port: 11434, targetPort: http}
{{- end }}
