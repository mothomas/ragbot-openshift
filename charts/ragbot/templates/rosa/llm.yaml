{{- if eq (include "ragbot.role" .) "rosa" }}
{{- $l := .Values.rosa.llm }}
# GPU inference: Ollama with the model baked into the image (images/ollama-model).
# No PVC and no download at start-up. No Route and no public Service either: the
# only way in is the Skupper Connector, so the unauthenticated Ollama API never
# leaves the application network.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-llm
  labels:
    {{- include "ragbot.labels" . | nindent 4 }}
    app.kubernetes.io/name: ollama-llm
spec:
  replicas: {{ $l.replicas }}
  # One GPU per pod: the old pod must release it before the new one can start.
  strategy: {type: Recreate}
  selector:
    matchLabels:
      {{- include "ragbot.selector" "ollama-llm" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ragbot.selector" "ollama-llm" | nindent 8 }}
    spec:
      enableServiceLinks: false
      {{- include "ragbot.pullSecrets" . | nindent 6 }}
      {{- with $l.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $l.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ollama
          {{- include "ragbot.ollamaContainer" (dict "root" . "image" .Values.images.llm "model" .Values.llm.model "extraEnv" (dict "OLLAMA_NUM_PARALLEL" $l.numParallel "OLLAMA_CONTEXT_LENGTH" .Values.llm.numCtx)) | nindent 10 }}
          # Load the model into VRAM before the pod reports Ready, at the same
          # context the agent asks for (OLLAMA_CONTEXT_LENGTH), so the first real
          # question does not pay for the load or a reload.
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - >-
                    i=0; until ollama list >/dev/null 2>&1; do i=$((i+1)); [ $i -gt 120 ] && exit 0; sleep 1; done;
                    ollama run {{ .Values.llm.model | quote }} "Reply with OK." >/dev/null 2>&1 || true
          resources:
            requests:
              {{- toYaml $l.resources.requests | nindent 14 }}
              nvidia.com/gpu: {{ $l.gpus }}
            limits:
              {{- toYaml $l.resources.limits | nindent 14 }}
              nvidia.com/gpu: {{ $l.gpus }}
---
# ClusterIP for in-namespace checks (oc port-forward, debugging). Skupper
# targets the pods by selector, not this Service.
apiVersion: v1
kind: Service
metadata:
  name: ollama-llm
  labels:
    {{- include "ragbot.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: ollama-llm
  ports:
    - {name: http, port: {{ .Values.llm.port }}, targetPort: http}
{{- end }}
