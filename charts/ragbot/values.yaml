# Shared values for both clusters. values-onprem.yaml / values-rosa.yaml set `role`
# and anything that differs per side. The ApplicationSet passes both files.

# onprem | rosa. Decides which templates render. Required.
role: ""

# ---------------------------------------------------------------------------
# The chat model. Shared because two sides depend on it: ROSA serves it (baked
# into images.llm), the on-prem agent asks for it by name and sets the context.
#
#   A10 / A10G (24 GB): gemma4:26b fits at a reduced context (~19 GB at 64K per
#                       ragbot's README; 16-32K leaves headroom). Verify: ollama ps
#   T4 (16 GB):         gemma4:26b does NOT fit. Use a ~9B tool-calling model;
#                       qwen3.5:9b is frappe-ai-agent's own default.
# ---------------------------------------------------------------------------
llm:
  model: gemma4:26b
  numCtx: 16384
  # Skupper routing key and the port on both ends.
  routingKey: ragbot-llm
  port: 11434
  # The on-prem Service name the Skupper Listener creates; the agent points here.
  host: ollama-llm

# Embedding model. Must return 768-dim vectors (KB Chunk is VECTOR(768)).
# Like llm.model, this is the name baked into images.embed; a startup probe
# fails the pod if the image doesn't hold it.
embed:
  model: nomic-embed-text

images:
  # All built by `make images` (Dockerfiles under images/); `make values` prints these.
  # Frappe v16 + erpnext + drive + frappe_ai + rag.
  bench:
    repository: quay.io/CHANGE-ME/ragbot-bench
    tag: "16"
  # vyogotech/frappe-ai-agent at the commit ragbot pins.
  agent:
    repository: quay.io/CHANGE-ME/frappe-ai-agent
    tag: 7f1ef10c
  # vyogotech/frappe-mcp-server at the commit ragbot pins.
  mcp:
    repository: quay.io/CHANGE-ME/frappe-mcp-server
    tag: a01ce12c
  # Ollama + llm.model baked in (images/ollama-model). Runs on the ROSA GPU.
  # The tag names the model; keep it in step with llm.model.
  llm:
    repository: quay.io/CHANGE-ME/ragbot-llm
    tag: gemma4-26b
  # Ollama + embed.model baked in. Runs on-prem, CPU only.
  embed:
    repository: quay.io/CHANGE-ME/ragbot-embed
    tag: nomic-embed-text
  pullPolicy: IfNotPresent
  pullSecrets: []

skupper:
  enabled: true
  # Red Hat Service Interconnect 2.x CRDs.
  apiVersion: skupper.io/v2alpha1

# Filled in by values-onprem.yaml / values-rosa.yaml.
onprem: {}
rosa: {}
